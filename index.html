<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>밑줄 먹는 여우 · 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

</head>
<body>
<div id="stage">
  <div id="label">밑줄 먹는 여우 · 프로토타입</div>
  <div id="viewport"><div id="world">
    <div class="plane" id="backP"></div>
    <div class="plane" id="ceilP"></div>
    <div class="plane" id="wallR"></div>
    <div class="plane" id="floorP"></div>
    <div id="floorFade"></div>
    <div id="floorGlow"></div>
    <div class="plane" id="wallL">
      <div id="wallShadow"></div>
      <div id="shelf" tabindex="0" role="button" aria-label="책장. 누르면 여우가 책을 한 권 꺼내 먹어요"><div id="sidePanel"></div></div>
      <div id="fog"></div>
    </div>
    <div id="fox" aria-hidden="true">
      <div id="foxBob"><div id="foxInner"></div></div>
      <div id="held">
        <div class="cover"></div>
        <div class="spread"><div class="pg l"></div><div class="pg r"></div></div>
      </div>
    </div>
  </div></div>
  
</div>
<div id="hint">커서를 움직이면 여우가 따라와요 · 안쪽에 커서를 두면 더 깊이 들어가요 · 책장을 누르면 책을 먹어요</div>

<div id="dream" aria-live="polite">
  <div id="ink">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
    <div class="dream-inner" id="dreamInner"></div>
  </div>
</div>
<nav id="tools" aria-label="여우의 언덕 도구">
  <a class="tool" id="toArchive" href="archive.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.2c3-1.4 6-1.3 9 .6c3-1.9 6-2 9-.6v12.6c-3-1.4-6-1.3-9 .6c-3-1.9-6-2-9-.6Z"/><path d="M12 6.8v12.6"/></svg><span class="tip">먹은 책 모아 보기</span></a>
  <button class="tool" id="snip" type="button" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.4 7.8 20 17.5M8.4 16.2 20 6.5"/></svg><span class="tip">꽃 잘라 꽃다발 받기</span></button>
  <div id="snipAsk" role="dialog" aria-label="꽃 자르기" hidden>
    <p>언덕에 핀 꽃 <b class="ask-n"></b>송이를 잘라<br>여우가 꽃다발로 만들어 줄까요?</p>
    <small>꽃밭과 먹은 책 더미가 비워져요. 먹은 책 기록은 남아요.</small>
    <div><button type="button" class="ask-yes">잘라 주세요</button><button type="button" class="ask-no">그만둘래요</button></div>
  </div>
</nav>
<div id="toast"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="wobble" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="3" seed="7"/>
    <feDisplacementMap in="SourceGraphic" scale="70" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<script src="js/main.js"></script>

</body>
</html>
