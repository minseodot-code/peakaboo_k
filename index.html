<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>밑줄 먹는 여우</title>
<meta name="description" content="어두운 서재의 티벳여우가 책을 꺼내 먹고 잠들면, 그 책에 밑줄 친 구절이 꿈속에서 펼쳐지는 독서 아카이브.">
<meta name="theme-color" content="#0b0b0b">
<meta property="og:type" content="website">
<meta property="og:site_name" content="밑줄 먹는 여우">
<meta property="og:title" content="밑줄 먹는 여우">
<meta property="og:description" content="여우가 책을 먹고 잠들면, 밑줄 친 구절이 꿈속에서 펼쳐져요.">
<meta property="og:image" content="/assets/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="어두운 서재에서 책을 펼쳐 든 티벳여우">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="/assets/icon-192.png">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

</head>
<body>
<div id="loader" role="status"><div class="dots" aria-hidden="true"><i></i><i></i><i></i></div><span>서재에 불을 켜는 중</span></div>
<div id="stage">
  <div id="label">밑줄 먹는 여우 · 프로토타입</div>
  <div id="viewport"><div id="world">
    <div class="plane" id="backP"></div>
    <div class="plane" id="ceilP"></div>
    <div class="plane" id="wallR"></div>
    <div class="plane" id="floorP"></div>
    <div class="plane" id="floorNear"></div>
    <div class="plane" id="wallL">
      <div id="wallShadow"></div>
      <div id="shelf" tabindex="0" role="button" aria-label="책장. 누르면 여우가 책을 한 권 꺼내 먹어요"><div id="sidePanel"></div></div>
      <div id="fog"></div>
    </div>
    <div id="fox" aria-hidden="true">
      <div id="foxBob"><div id="foxInner"></div></div>
      <div id="held">
        <div class="cover"></div>
        <div class="spread"><div class="pg l"></div><div class="pg r"></div></div>
      </div>
    </div>
  </div></div>
  
</div>
<div id="hint">커서를 움직이면 여우가 따라와요 · 안쪽에 커서를 두면 더 깊이 들어가요 · 책장을 누르면 책을 먹어요</div>

<div id="dream" aria-live="polite">
  <div id="ink">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
    <div class="dream-inner" id="dreamInner"></div>
  </div>
</div>
<div id="toast"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="wobble" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="3" seed="7"/>
    <feDisplacementMap in="SourceGraphic" scale="70" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<script src="js/main.js"></script>

</body>
</html>
